<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐰 うさぎの自動化日記</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink:    #ff8fab;
      --pink2:   #ffd6e0;
      --peach:   #fdf0e0;
      --cream:   #fffaf5;
      --mint:    #c3f0ca;
      --mint2:   #a8e6b0;
      --yellow:  #fff3b0;
      --brown:   #8b5e3c;
      --shadow:  rgba(255,143,171,0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: var(--peach);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 20px 10px 40px;
    }

    .app {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ========== タイトル ========== */
    h1 {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 1.5rem;
      color: var(--pink);
      text-align: center;
      text-shadow: 0 2px 8px var(--shadow);
      letter-spacing: 0.05em;
    }

    /* ========== ステータス ========== */
    .status {
      background: white;
      border-radius: 20px;
      padding: 14px 20px;
      display: flex;
      justify-content: space-around;
      box-shadow: 0 4px 16px var(--shadow);
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #aaa;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--brown);
    }

    /* エネルギーバー */
    .energy-bar-wrap {
      background: #eee;
      border-radius: 20px;
      height: 10px;
      width: 100px;
      overflow: hidden;
      margin-top: 2px;
    }

    .energy-bar {
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(90deg, var(--mint2), #5ecb68);
      transition: width 0.4s ease;
    }

    /* ========== キャラクター ========== */
    .scene {
      background: white;
      border-radius: 24px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 20px var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .scene-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #fff8f0 0%, #fff0f5 100%);
      z-index: 0;
    }

    .road {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 30px;
      background: repeating-linear-gradient(
        90deg,
        #f0e0d0 0px, #f0e0d0 40px,
        #e8d0c0 40px, #e8d0c0 80px
      );
      border-top: 2px solid #e0c8b0;
      z-index: 1;
    }

    .character {
      font-size: 64px;
      position: relative;
      z-index: 2;
      display: inline-block;
      animation: idle 2s ease-in-out infinite;
      transition: transform 0.2s;
      cursor: pointer;
      user-select: none;
    }

    .character:hover { transform: scale(1.1); }

    .character.delivering {
      animation: deliver-anim 0.4s ease-in-out;
    }

    .character.resting {
      animation: rest-anim 1s ease-in-out;
    }

    @keyframes idle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes deliver-anim {
      0% { transform: translateX(0); }
      30% { transform: translateX(20px) rotate(5deg); }
      60% { transform: translateX(-5px) rotate(-2deg); }
      100% { transform: translateX(0) rotate(0deg); }
    }

    @keyframes rest-anim {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(-10deg); }
      75% { transform: rotate(10deg); }
      100% { transform: rotate(0deg); }
    }

    /* コイン演出 */
    .coin-pop {
      position: absolute;
      font-size: 1.2rem;
      font-weight: 700;
      color: #f5a623;
      z-index: 10;
      pointer-events: none;
      animation: coin-fly 1s ease-out forwards;
    }

    @keyframes coin-fly {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-60px) scale(1.4); }
    }

    /* ========== ボタン ========== */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .btn {
      padding: 14px 8px;
      border: none;
      border-radius: 18px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 0 rgba(0,0,0,0.1);
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.1);
    }

    .btn-deliver { background: var(--pink2); color: #c45c7a; }
    .btn-rest    { background: var(--mint);  color: #3a7a45; }
    .btn-code    { background: var(--yellow); color: #7a6c00; }

    /* ========== ミッション ========== */
    .missions {
      background: white;
      border-radius: 20px;
      padding: 14px 18px;
      box-shadow: 0 4px 16px var(--shadow);
    }

    .missions h2 {
      font-size: 0.85rem;
      color: #bbb;
      margin-bottom: 10px;
      letter-spacing: 0.08em;
    }

    .mission {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px dashed #f0e0e8;
      font-size: 0.88rem;
      color: #555;
    }

    .mission:last-child { border-bottom: none; }

    .mission-check {
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 2px solid #ffd6e0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem;
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .mission.done .mission-check {
      background: var(--pink);
      border-color: var(--pink);
      color: white;
    }

    .mission.done .mission-text { text-decoration: line-through; color: #bbb; }

    /* ========== コードエリア ========== */
    .code-section {
      background: #1e1e2e;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      display: none;
    }

    .code-section.open { display: block; }

    .code-header {
      background: #2a2a3e;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .code-header span {
      font-family: monospace;
      font-size: 0.8rem;
      color: #888;
    }

    .code-dots {
      display: flex; gap: 6px;
    }

    .code-dot {
      width: 10px; height: 10px; border-radius: 50%;
    }

    .hint-box {
      background: #2a2a3e;
      padding: 8px 16px;
      border-left: 3px solid var(--pink);
    }

    .hint-box p {
      font-family: 'Courier New', monospace;
      font-size: 0.78rem;
      color: #aaa;
      line-height: 1.6;
    }

    .hint-box .hl { color: #ff8fab; }
    .hint-box .hl2 { color: #c3f0ca; }
    .hint-box .hl3 { color: #fff3b0; }

    textarea#codeInput {
      width: 100%;
      height: 120px;
      background: #1e1e2e;
      color: #e0e0ff;
      border: none;
      padding: 14px 16px;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      resize: vertical;
      outline: none;
      line-height: 1.6;
    }

    textarea#codeInput::placeholder { color: #555; }

    .code-footer {
      background: #2a2a3e;
      padding: 10px 16px;
      display: flex;
      justify-content: flex-end;
    }

    .btn-run {
      background: linear-gradient(135deg, var(--pink), #ff6b9d);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 10px 24px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 12px rgba(255,143,171,0.4);
    }

    .btn-run:active { transform: scale(0.97); }

    /* ========== ログ ========== */
    #log {
      text-align: center;
      font-size: 0.95rem;
      color: var(--brown);
      min-height: 28px;
      padding: 8px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 2px 8px var(--shadow);
      transition: all 0.3s;
    }

    #log.success { background: var(--mint); color: #2d6e35; }
    #log.error   { background: #ffe0e0; color: #c0392b; }

    /* ========== エラーヒント ========== */
    #errorHint {
      font-size: 0.8rem;
      color: #e74c3c;
      text-align: center;
      min-height: 16px;
      padding: 0 8px;
    }
  </style>
</head>
<body>

<div class="app">

  <h1>🐰 うさぎの自動化日記</h1>

  <!-- ステータス -->
  <div class="status">
    <div class="stat">
      <span class="stat-label">🌰 コイン</span>
      <span class="stat-value" id="coin">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">⚡ 体力</span>
      <span class="stat-value" id="energyNum">100</span>
      <div class="energy-bar-wrap">
        <div class="energy-bar" id="energyBar" style="width:100%"></div>
      </div>
    </div>
    <div class="stat">
      <span class="stat-label">📦 配達数</span>
      <span class="stat-value" id="deliveryCount">0</span>
    </div>
  </div>

  <!-- キャラクター -->
  <div class="scene">
    <div class="scene-bg"></div>
    <div class="road"></div>
    <div class="character" id="character" onclick="deliver()">🐰</div>
  </div>

  <!-- ボタン -->
  <div class="actions">
    <button class="btn btn-deliver" onclick="deliver()">📦 配達する</button>
    <button class="btn btn-rest"    onclick="rest()">💤 休む</button>
    <button class="btn btn-code"    onclick="openCode()">💻 コード</button>
  </div>

  <!-- ミッション -->
  <div class="missions">
    <h2>📋 MISSION</h2>
    <div class="mission" id="m1">
      <div class="mission-check">✓</div>
      <span class="mission-text">初めての配達をしよう（コイン50獲得）</span>
    </div>
    <div class="mission" id="m2">
      <div class="mission-check">✓</div>
      <span class="mission-text">コードで deliver(3) を実行してみよう</span>
    </div>
    <div class="mission" id="m3">
      <div class="mission-check">✓</div>
      <span class="mission-text">for i in range(5): を使って自動化しよう</span>
    </div>
    <div class="mission" id="m4">
      <div class="mission-check">✓</div>
      <span class="mission-text">コイン500枚を貯めよう！</span>
    </div>
  </div>

  <!-- コードエリア -->
  <div class="code-section" id="codeSection">
    <div class="code-header">
      <div class="code-dots">
        <div class="code-dot" style="background:#ff6057"></div>
        <div class="code-dot" style="background:#ffbd2e"></div>
        <div class="code-dot" style="background:#28c940"></div>
      </div>
      <span>usagi.py 🐍</span>
    </div>
    <div class="hint-box">
      <p>
        <span class="hl3"># 使えるコマンド：</span><br>
        <span class="hl">deliver()</span>    <span style="color:#666">← 配達する</span><br>
        <span class="hl2">rest()</span>      <span style="color:#666">← 休む</span><br>
        <span class="hl3">for i in range(5):</span><br>
        &nbsp;&nbsp;&nbsp;&nbsp;<span class="hl">deliver()</span>  <span style="color:#666">← 5回繰り返す</span>
      </p>
    </div>
    <textarea id="codeInput" placeholder="# ここにコードを書こう！
deliver()

# もしくは繰り返し：
for i in range(3):
    deliver()"></textarea>
    <div id="errorHint"></div>
    <div class="code-footer">
      <button class="btn-run" onclick="runCode()">▶ 実行する</button>
    </div>
  </div>

  <!-- ログ -->
  <p id="log">🐰 クリックして配達しよう！</p>

</div>

<script>
  let coin = 0;
  let energy = 100;
  let deliveryCount = 0;
  const missions = { m1: false, m2: false, m3: false, m4: false };

  // ======= UI更新 =======
  function updateUI() {
    document.getElementById("coin").textContent = coin;
    document.getElementById("energyNum").textContent = energy;
    document.getElementById("energyBar").style.width = energy + "%";
    document.getElementById("deliveryCount").textContent = deliveryCount;
    checkMissions();
  }

  // ======= ミッション =======
  function checkMissions() {
    if (!missions.m1 && deliveryCount >= 1) {
      missions.m1 = true;
      completeMission("m1");
    }
    if (!missions.m4 && coin >= 500) {
      missions.m4 = true;
      completeMission("m4");
    }
  }

  function completeMission(id) {
    const el = document.getElementById(id);
    if (el) el.classList.add("done");
  }

  // ======= 配達 =======
  function deliver(amount = 1) {
    let delivered = 0;
    for (let i = 0; i < amount; i++) {
      if (energy <= 0) {
        log("🐰 つかれて寝ちゃった…", "error");
        break;
      }
      coin += 50;
      energy -= 10;
      if (energy < 0) energy = 0;
      deliveryCount++;
      delivered++;
    }
    if (delivered > 0) {
      const msg = amount > 1
        ? `📦 ${delivered}回配達したよ！ +${delivered * 50}コイン`
        : "📦 配達したよ！ +50コイン";
      log(msg, "success");
      animateChar("delivering");
      showCoinPop(`+${delivered * 50}`);
    }
    updateUI();
  }

  // ======= 休む =======
  function rest() {
    energy = Math.min(100, energy + 20);
    log("💤 ゆっくり休んだよ。体力回復！", "");
    animateChar("resting");
    updateUI();
  }

  // ======= コードエリア切り替え =======
  function openCode() {
    const sec = document.getElementById("codeSection");
    sec.classList.toggle("open");
    if (sec.classList.contains("open")) {
      document.getElementById("codeInput").focus();
    }
  }

  // ======= コード実行（Pythonっぽい構文対応）=======
  function runCode() {
    const raw = document.getElementById("codeInput").value;
    document.getElementById("errorHint").textContent = "";

    try {
      const result = parsePython(raw);
      if (result.error) {
        log("🐰 ちょっとむずかしかったみたい…", "error");
        document.getElementById("errorHint").textContent = "エラー: " + result.error;
        return;
      }
      executeCommands(result.commands);
      log("✨ コード成功！うさぎが自動で動いたよ！", "success");

      // ミッションチェック
      if (!missions.m2 && result.hasDeliverCall) {
        missions.m2 = true;
        completeMission("m2");
      }
      if (!missions.m3 && result.hasForLoop) {
        missions.m3 = true;
        completeMission("m3");
      }
    } catch(e) {
      log("🐰 ちょっとむずかしかったみたい…", "error");
      document.getElementById("errorHint").textContent = "エラー: " + e.message;
    }

    updateUI();
  }

  // ======= Pythonっぽい構文パーサー =======
  function parsePython(code) {
    const lines = code.split("\n");
    const commands = [];
    let hasDeliverCall = false;
    let hasForLoop = false;
    let i = 0;

    while (i < lines.length) {
      const line = lines[i];
      const trimmed = line.trim();

      // コメント・空行スキップ
      if (!trimmed || trimmed.startsWith("#")) { i++; continue; }

      // for i in range(N): 対応
      const forMatch = trimmed.match(/^for\s+\w+\s+in\s+range\((\d+)\)\s*:$/);
      if (forMatch) {
        const times = parseInt(forMatch[1]);
        if (isNaN(times) || times > 100) {
          return { error: `range(${forMatch[1]}) が大きすぎます（最大100）` };
        }
        hasForLoop = true;
        const bodyCommands = [];
        i++;

        // インデントされたボディを収集
        while (i < lines.length) {
          const bodyLine = lines[i];
          const bodyTrimmed = bodyLine.trim();
          if (!bodyTrimmed || bodyTrimmed.startsWith("#")) { i++; continue; }
          // インデントがない → ループ終了
          if (bodyLine.length > 0 && bodyLine[0] !== " " && bodyLine[0] !== "\t") break;

          const cmd = parseCommand(bodyTrimmed);
          if (cmd.error) return { error: cmd.error };
          bodyCommands.push(cmd);
          if (cmd.type === "deliver") hasDeliverCall = true;
          i++;
        }

        if (bodyCommands.length === 0) {
          return { error: "for ループの中身がありません" };
        }

        commands.push({ type: "loop", times, body: bodyCommands });
        continue;
      }

      // 通常コマンド
      const cmd = parseCommand(trimmed);
      if (cmd.error) return { error: cmd.error };
      commands.push(cmd);
      if (cmd.type === "deliver") hasDeliverCall = true;
      i++;
    }

    return { commands, hasDeliverCall, hasForLoop };
  }

  function parseCommand(s) {
    // deliver() または deliver(N)
    const deliverMatch = s.match(/^deliver\((\d*)\)$/);
    if (deliverMatch) {
      const n = deliverMatch[1] ? parseInt(deliverMatch[1]) : 1;
      if (n > 20) return { error: `deliver(${n}) は大きすぎます（最大20）` };
      return { type: "deliver", amount: n };
    }

    // rest()
    if (s === "rest()") return { type: "rest" };

    return { error: `「${s}」はわからないコマンドです` };
  }

  function executeCommands(commands) {
    for (const cmd of commands) {
      if (cmd.type === "deliver") deliver(cmd.amount);
      else if (cmd.type === "rest") rest();
      else if (cmd.type === "loop") {
        for (let k = 0; k < cmd.times; k++) {
          executeCommands(cmd.body);
        }
      }
    }
  }

  // ======= ユーティリティ =======
  function animateChar(cls) {
    const ch = document.getElementById("character");
    ch.classList.remove("delivering", "resting");
    ch.getBoundingClientRect(); // reflow
    ch.classList.add(cls);
    setTimeout(() => ch.classList.remove(cls), 1000);
  }

  function showCoinPop(text) {
    const scene = document.querySelector(".scene");
    const pop = document.createElement("div");
    pop.className = "coin-pop";
    pop.textContent = text;
    pop.style.left = (Math.random() * 60 + 20) + "%";
    pop.style.top = "30%";
    scene.appendChild(pop);
    setTimeout(() => pop.remove(), 1000);
  }

  function log(message, type = "") {
    const el = document.getElementById("log");
    el.textContent = message;
    el.className = type;
  }

  // 初期化
  updateUI();
</script>
</body>
</html>
